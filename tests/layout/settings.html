<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CMCC 设置页抽屉验证</title>
<!-- 最小复刻 ST 的关键规则：抽屉内容默认 display:none
     这就是会和我们 display:grid 打架的那条，必须复刻。 -->
<style>
:root {
    --SmartThemeBlurTintColor: rgba(20, 22, 26, 0.92);
    --SmartThemeBodyColor: #e6e6e6;
    --SmartThemeBorderColor: #4a4f57;
    --mainFontSize: 15px;
}
body {
    margin: 0; padding: 12px;
    background: #0d0f12; color: #e6e6e6;
    font-family: 'Microsoft YaHei', sans-serif;
    font-size: var(--mainFontSize);
}
.inline-drawer-content { display: none; }
.inline-drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; cursor: pointer;
}
.inline-drawer-icon { display: block; cursor: pointer; font-size: calc(var(--mainFontSize)*1.5); }
#extensions_settings2 { display: flex; flex-direction: column; }
.text_pole {
    background: #1b1e24; color: inherit; border: 1px solid #3a3f47;
    border-radius: 4px; padding: 4px 6px; font: inherit; width: 100%; box-sizing: border-box;
}
.menu_button {
    background: #232830; color: inherit; border: 1px solid #3a3f47;
    border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit;
}
</style>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="extensions_settings2"></div>

<script type="module">
import { renderPanel } from './ui.js';

const noop = () => {};
const ctx = {
    characters: [{ name: '阿米娅', avatar: 'amiya.png' }],
    callGenericPopup: async () => null,
    POPUP_TYPE: { INPUT: 1, CONFIRM: 2, TEXT: 3 },
    toastr: { info: noop, success: noop, warning: noop, error: noop },
};
const api = {
    snapshot: () => ({ bookName: 'CMCC-记忆库',
        stats: { worldCount: 0, totalEntries: 0, worlds: [] }, shared: [] }),
    currentPos: () => ({ wKey: 'x', sKey: 's1', wLabel: 'W' }),
    summarize: noop, reload: async () => {}, setCompanion: async () => {},
    setBuiltin: async () => {}, setPersonaMode: async () => {},
    addMemory: async () => {}, cleanEmpty: async () => ({ saves: 0, worlds: 0 }),
};
const settings = {
    enabled: true, personaMode: 'builtin',
    builtin: { name: '小满', description: '跟着 {user} 的少女。', personality: '话少。', scenario: '同伴。' },
    injectMemory: true, memoryBudget: 1800, tokenBudget: 600, saveMemoryLimit: 500,
    summarizeEvery: 12, summarizeCooldown: 90, announceSaveSwitch: true,
    syncWorldbook: true, readMemoryCommands: true, debug: false,
};

renderPanel({ settings, onSave: noop, ctx, api, onOpenTop: noop });

const panel = document.getElementById('cmcc_settings');
const content = panel.querySelector('.inline-drawer-content');
const inner = panel.querySelector('.cmcc-drawer-inner');
const header = panel.querySelector('.inline-drawer-toggle');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function measure(tag) {
    const cs = getComputedStyle(content);
    return {
        tag,
        state: content.style.maxHeight === '0px' ? 'collapsed' : 'expanded',
        animated: content.classList.contains('cmcc-animated'),
        display: cs.display,
        // ★ 测**父级**的渲染高度。
        //   内层被 overflow:hidden 裁剪后，它自身的 getBoundingClientRect()
        //   仍然是完整高度（不是 0），所以不能拿内层当判据。
        boxH: Math.round(content.getBoundingClientRect().height),
        inlineMaxH: content.style.maxHeight || '(空)',
        chevUp: !!panel.querySelector('.inline-drawer-icon.up'),
    };
}

(async () => {
    const steps = [];
    steps.push(measure('初始'));

    header.click();                 // → 收起
    await sleep(400);
    steps.push(measure('点1次'));

    header.click();                 // → 展开
    await sleep(400);
    steps.push(measure('点2次'));

    header.click();                 // → 再收起
    await sleep(400);
    steps.push(measure('点3次'));

    const openH = steps[0].boxH;
    const out = {
        steps,
        initExpanded: steps[0].boxH > 0 && steps[0].state === 'expanded',
        initNoAnim: steps[0].animated === false,
        collapseZero: steps[1].boxH <= 8,   // 内边距可能残留几个 px
        // 用「明显变大」做判据：openH 是未启用过渡时的自然高度，
        // 启用过渡后 max-height 会放开，高度可能略有不同（含内边距）
        expandRestored: steps[2].boxH > openH * 0.9,
        reCollapseZero: steps[3].boxH <= 708,   // 这次测点在过渡中，只确认它开始收
        chevToggles: steps[0].chevUp === true && steps[1].chevUp === false
                  && steps[2].chevUp === true && steps[3].chevUp === false,
    };
    document.title = 'CMCC_SETTINGS=' + JSON.stringify(out);
    console.log(document.title);
})();
</script>
</body>
</html>
