<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CMCC 设置页浏览器验证</title>
<!--
  浏览器验证页（真实布局 + 真实 CSS）
  ─────────────────────────────────────
  为什么需要它：Node 里的假 DOM **不执行 CSS、不做布局**。
  设置面板"点不开"那个 bug（.inline-drawer-content 上的 padding 干扰）
  假 DOM 完全测不出来，只有真浏览器能发现。

  用法：
      node tests/layout/sync.mjs
      node tools/shot.mjs tests/layout/settings.html --title
      或  node tests/layout/run.mjs

  结果写在 document.title，格式 CMCC_SETTINGS={...}
-->
<style>
/* 最小复刻 ST 的关键规则 —— 尤其这一条，它是历史 bug 的根源 */
:root {
    --SmartThemeBlurTintColor: rgba(20, 22, 26, 0.92);
    --SmartThemeBodyColor: #e6e6e6;
    --SmartThemeBorderColor: #4a4f57;
    --mainFontSize: 15px;
}
body {
    margin: 0; padding: 12px;
    background: #0d0f12; color: #e6e6e6;
    font-family: 'Microsoft YaHei', sans-serif;
    font-size: var(--mainFontSize);
}
/* ★ ST 就靠这条把抽屉收起。我们不能再自己加 padding ——
   max-height 限制的是内容盒子，padding 加在外面，会残留。 */
.inline-drawer-content { display: none; }
.inline-drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; cursor: pointer;
}
.inline-drawer-icon { display: block; cursor: pointer; font-size: calc(var(--mainFontSize)*1.5); }
#extensions_settings2 { display: flex; flex-direction: column; }
.text_pole {
    background: #1b1e24; color: inherit; border: 1px solid #3a3f47;
    border-radius: 4px; padding: 4px 6px; font: inherit; width: 100%; box-sizing: border-box;
}
.menu_button {
    background: #232830; color: inherit; border: 1px solid #3a3f47;
    border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit;
}
</style>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="extensions_settings2"></div>

<script type="module">
import { renderPanel } from './ui.js';

const noop = () => {};
const errors = [];

const ctx = {
    characters: [{ name: '阿米娅', avatar: 'amiya.png' }],
    callGenericPopup: async () => null,
    POPUP_TYPE: { INPUT: 1, CONFIRM: 2, TEXT: 3 },
    toastr: { info: noop, success: noop, warning: noop, error: noop },
};

// ⚠ 这里必须和 index.js 真正暴露的 api 一致，
//   少一个方法 renderPanel 就会抛错（旧版这个页面就是这么坏掉的）
const settings = {
    enabled: true, personaMode: 'builtin',
    builtin: { name: '小满', description: '跟着 {user} 的少女。', personality: '话少。', scenario: '同伴。' },
    builtins: [
        { id: 'p1', name: '小满', description: '跟着 {user} 的少女。', personality: '话少。', scenario: '同伴。' },
        { id: 'p2', name: '阿米娅', description: '罗德岛的领袖。', personality: '沉稳。', scenario: '' },
    ],
    activeBuiltinId: 'p1',
    injectMemory: true, memoryBudget: 1800, tokenBudget: 2400, saveMemoryLimit: 500,
    recentMemoryLimit: 10, relevantMemoryLimit: 5,
    summarizeEvery: 12, summarizeCooldown: 90, announceSaveSwitch: true,
    syncWorldbook: true, readMemoryCommands: true, debug: false,
};

const api = {
    snapshot: () => ({
        bookName: 'CMCC-记忆库',
        stats: { worldCount: 1, totalEntries: 3, sharedCount: 0, worlds: [
            { key: 'w1', label: '世界A', saveCount: 1, count: 3,
              saves: [{ key: 's1', label: '存档1', count: 3 }] },
        ] },
        shared: [],
    }),
    currentPos: () => ({ wKey: 'w1', sKey: 's1', wLabel: '世界A' }),
    listPersonas: () => settings.builtins.map((x) => ({
        id: x.id, name: x.name, active: x.id === settings.activeBuiltinId,
        descLen: (x.description || '').length,
    })),
    setActivePersona: async () => true,
    addPersona: async () => 'new',
    deletePersona: async () => true,
    renamePersona: async () => true,
    exportAll: async () => ({ _cmcc: true, persona: settings.builtin, worlds: {} }),
    importAll: async () => ({ persona: 'x', worlds: 0, saves: 0, entries: 0 }),
    setBuiltin: async () => {}, setPersonaMode: async () => {},
    summarize: noop, reload: async () => {}, addMemory: async () => {},
    cleanEmpty: async () => ({ saves: 0, worlds: 0 }),
};

const result = { errors, ok: false };

try {
    renderPanel({ settings, onSave: noop, ctx, api, onOpenTop: noop });
} catch (e) {
    errors.push('renderPanel 抛错: ' + (e && e.message));
}

try {
    const panel = document.getElementById('cmcc_settings');
    const content = panel && panel.querySelector('.inline-drawer-content');
    const header = panel && panel.querySelector('.inline-drawer-toggle');
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    if (!panel || !content || !header) {
        errors.push('骨架不完整: panel=' + !!panel + ' content=' + !!content + ' header=' + !!header);
    } else {
        const H = () => Math.round(content.getBoundingClientRect().height);
        const D = () => getComputedStyle(content).display;
        const chevUp = () => !!panel.querySelector('.inline-drawer-icon.up');

        const step = (tag) => ({ tag, h: H(), display: D(), up: chevUp() });

        const steps = [];
        steps.push(step('初始'));
        header.click();
        await sleep(350);
        steps.push(step('点1次'));
        header.click();
        await sleep(350);
        steps.push(step('点2次'));
        header.click();
        await sleep(350);
        steps.push(step('点3次'));

        result.steps = steps;
        result.initExpanded = steps[0].h > 0 && steps[0].display === 'block';
        result.collapseHidden = steps[1].display === 'none' && steps[1].h === 0;
        result.expandRestored = steps[2].display === 'block' && steps[2].h > 0;
        result.reCollapseHidden = steps[3].display === 'none' && steps[3].h === 0;
        result.chevToggles = steps[0].up && !steps[1].up && steps[2].up && !steps[3].up;

        // 结构检查
        result.hasPersonaBar = !!panel.querySelector('.cmcc-pbar');
        result.personaOptions = panel.querySelectorAll('option').length;
        result.hasOverview = !!panel.querySelector('.cmcc-ov-head');

        // ★ 赞助按钮：必须是真链接、指向爱发电、且真的看得见
        // ⚠ 注意：上面刚点过三次，面板停在「收起」状态。
        //   收起时 display:none，量到的尺寸是 0 —— 所以要先展开再量。
        if (steps[3].display === 'none') header.click();
        await sleep(120);

        const spon = panel.querySelector('.cmcc-support-btn');
        result.hasSponsor = !!spon;
        if (spon) {
            result.sponsorHref = spon.getAttribute('href');
            result.sponsorBlank = spon.getAttribute('target') === '_blank';
            result.sponsorIsLink = spon.tagName === 'A';
            const spr = spon.getBoundingClientRect();
            result.sponsorVisible = spr.width > 40 && spr.height > 10;
        }
        result.bars = panel.querySelectorAll('.cmcc-pbar').length;

        // ★ 全局扫一遍：有没有元素因为父级被裁而"看不见"
        //   （这正是 padding + max-height 那个 bug 的形态）
        const contentRect = content.getBoundingClientRect();
        const visibles = [...content.querySelectorAll('*')].filter((el) => {
            const r = el.getBoundingClientRect();
            return r.height > 0 && r.width > 0;
        });
        result.visibleDescendants = visibles.length;

        result.ok = errors.length === 0
            && result.initExpanded && result.collapseHidden
            && result.expandRestored && result.reCollapseHidden
            && result.chevToggles && result.hasPersonaBar
            && result.personaOptions === 2 && result.bars === 2
            // 赞助按钮
            && result.hasSponsor === true
            && result.sponsorIsLink === true
            && result.sponsorVisible === true
            && result.sponsorBlank === true
            && result.sponsorHref === 'https://afdian.com/a/WhiteShawqi';
    }
} catch (e) {
    errors.push('检查过程抛错: ' + (e && e.message));
}

// 结果同时写进 title（给 tools/shot.mjs --title 读）和页面，便于人眼看
document.title = 'CMCC_SETTINGS=' + JSON.stringify(result);
try { console.log(document.title); } catch (e) {}

const pre = document.createElement('pre');
pre.id = 'cmcc_result';
pre.style.cssText = 'margin-top:12px;padding:8px;background:#111;color:#9f9;font-size:12px;'
    + 'white-space:pre-wrap;border-radius:4px';
pre.textContent = '结果: ' + (result.ok ? '全部通过 ✓' : '有失败 ✗') + '\n'
    + JSON.stringify(result, null, 2);
document.body.appendChild(pre);
</script>
</body>
</html>
